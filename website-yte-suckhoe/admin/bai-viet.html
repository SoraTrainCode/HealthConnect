<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quản lý bài viết, Trang quản trị</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <div class="section-title">
      <h2 class="h4">Quản lý bài viết</h2>
      <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#articleModal" onclick="openArticleModal()">+ Thêm bài viết</button>
    </div>

    <table class="table table-admin align-middle">
      <thead><tr><th>Tiêu đề</th><th>Danh mục</th><th>Trạng thái</th><th>Lượt xem</th><th></th></tr></thead>
      <tbody id="articleTable"></tbody>
    </table>
  </div>
</div>

<!-- Modal thêm/sửa bài viết -->
<div class="modal fade" id="articleModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="articleModalTitle">Thêm bài viết</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Tiêu đề</label>
          <input type="text" id="fTitle" class="form-control">
        </div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Danh mục</label>
            <select id="fCategory" class="form-select"></select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Trạng thái</label>
            <select id="fStatus" class="form-select">
              <option value="published">Đã đăng</option>
              <option value="draft">Bản nháp</option>
            </select>
          </div>
        </div>
        <div class="mb-3 mt-3">
          <label class="form-label">Tóm tắt</label>
          <textarea id="fSummary" class="form-control" rows="2"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Nội dung</label>
          <textarea id="fContent" class="form-control" rows="6" placeholder="Nội dung bài viết (HTML đơn giản)"></textarea>
          <div class="form-text">Trong bản triển khai thật, đây sẽ là trình soạn thảo rich-text (TinyMCE/CKEditor).</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-brand" data-bs-dismiss="modal">Hủy</button>
        <button class="btn btn-brand" onclick="saveArticleMock()">Lưu bài viết</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script>window.__BASE__ = "../";</script>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  renderAdminShell("articles");

  // Bản mock: mọi bài coi như đã "published" trừ khi người dùng đổi trong modal (không lưu thật).
  function renderTable() {
    document.getElementById("articleTable").innerHTML = ARTICLES.map(
      (a) => `<tr>
        <td>${a.title}</td>
        <td>${catName(a.categoryId)}</td>
        <td><span class="badge badge-status-published px-2 py-1">Đã đăng</span></td>
        <td>${a.views}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-brand" data-bs-toggle="modal" data-bs-target="#articleModal" onclick="openArticleModal(${a.id})">Sửa</button>
          <button class="btn btn-sm btn-outline-danger" onclick="alert('Đây là bản demo giao diện, thao tác xóa sẽ gọi API DELETE /api/articles.php khi có backend.')">Xóa</button>
        </td>
      </tr>`
    ).join("");
  }

  function fillCategorySelect() {
    document.getElementById("fCategory").innerHTML = CATEGORIES.map((c) => `<option value="${c.id}">${c.name}</option>`).join("");
  }

  function openArticleModal(id) {
    fillCategorySelect();
    const a = id ? getArticleById(id) : null;
    document.getElementById("articleModalTitle").textContent = a ? "Sửa bài viết" : "Thêm bài viết";
    document.getElementById("fTitle").value = a ? a.title : "";
    document.getElementById("fSummary").value = a ? a.summary : "";
    document.getElementById("fContent").value = a ? a.content.replace(/<[^>]+>/g, "") : "";
    if (a) document.getElementById("fCategory").value = a.categoryId;
  }

  function saveArticleMock() {
    alert("Đây là bản demo giao diện, dữ liệu sẽ được gửi tới /api/articles.php (POST/PUT) khi nối backend PHP + MySQL.");
    bootstrap.Modal.getInstance(document.getElementById("articleModal")).hide();
  }

  renderTable();
</script>
</body>
</html>

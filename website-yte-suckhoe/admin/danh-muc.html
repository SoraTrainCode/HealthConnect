<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quản lý danh mục, Trang quản trị</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <div class="section-title">
      <h2 class="h4">Quản lý danh mục</h2>
    </div>

    <div class="row g-4">
      <div class="col-lg-7">
        <table class="table table-admin align-middle">
          <thead><tr><th>Tên danh mục</th><th>Số bài viết</th><th></th></tr></thead>
          <tbody id="catTable"></tbody>
        </table>
      </div>
      <div class="col-lg-5">
        <div class="bmi-panel">
          <h3 class="h6 mb-3">Thêm danh mục mới</h3>
          <div class="mb-3">
            <label class="form-label">Tên danh mục</label>
            <input type="text" id="newCatName" class="form-control" placeholder="Ví dụ: Sức khỏe người cao tuổi">
          </div>
          <button class="btn btn-brand w-100" onclick="addCategoryMock()">Thêm danh mục</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script>window.__BASE__ = "../";</script>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  renderAdminShell("categories");

  function renderCatTable() {
    document.getElementById("catTable").innerHTML = CATEGORIES.map((c) => {
      const count = ARTICLES.filter((a) => a.categoryId === c.id).length;
      return `<tr>
        <td><span class="cat-pill" style="border-color:${c.color}55">${c.name}</span></td>
        <td>${count}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-brand" onclick="alert('Sửa danh mục, sẽ gọi PUT /api/categories.php khi nối backend.')">Sửa</button>
          <button class="btn btn-sm btn-outline-danger" ${count > 0 ? "disabled title='Không thể xóa danh mục đang có bài viết'" : ""}
            onclick="alert('Xóa danh mục, sẽ gọi DELETE /api/categories.php khi nối backend.')">Xóa</button>
        </td>
      </tr>`;
    }).join("");
  }

  function addCategoryMock() {
    const name = document.getElementById("newCatName").value.trim();
    if (!name) return alert("Vui lòng nhập tên danh mục.");
    alert(`Đã gửi yêu cầu tạo danh mục "${name}" (demo, sẽ POST /api/categories.php khi nối backend).`);
    document.getElementById("newCatName").value = "";
  }

  renderCatTable();
</script>
</body>
</html>

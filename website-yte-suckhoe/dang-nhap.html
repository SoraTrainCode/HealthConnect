<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đăng nhập, Sổ Tay Sức Khỏe</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<main class="container py-5">
  <div class="auth-panel">
    <h1 class="h3 font-display mb-1 text-center">Đăng nhập</h1>
    <p class="text-muted text-center mb-4 small">Đăng nhập để lưu lịch sử đo BMI và hội thoại chatbot.</p>

    <div id="loginError" class="alert alert-danger py-2 small" style="display:none"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="ban@vidu.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Mật khẩu</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-brand w-100 mb-3">Đăng nhập</button>
      <p class="text-center small text-muted mb-0">
        Chưa có tài khoản? <a href="dang-ky.html">Đăng ký ngay</a>
      </p>
    </form>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/chatbot.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  renderHeader("");
  renderFooter();
  initLoginForm();
</script>
</body>
</html>

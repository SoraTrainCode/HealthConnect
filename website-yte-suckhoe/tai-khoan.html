<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tài khoản của tôi, Sổ Tay Sức Khỏe</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<main class="container py-5">
  <div class="section-title"><h2>Hồ sơ &amp; lịch sử theo dõi sức khỏe</h2></div>

  <div class="row g-4">
    <div class="col-lg-4">
      <div class="bmi-panel">
        <h3 class="h6 mb-3">Thông tin cá nhân</h3>
        <div class="mb-2"><span class="text-muted small">Họ tên</span><div id="profileName" class="fw-semibold">Đang tải.</div></div>
        <div class="mb-3"><span class="text-muted small">Vai trò</span><div>Người dùng</div></div>
        <a href="bmi.html" class="btn btn-outline-brand w-100">Đo BMI mới</a>
      </div>
    </div>
    <div class="col-lg-8">
      <div class="section-title"><h2 class="h5">Lịch sử đo BMI</h2></div>
      <table class="table bmi-history-table">
        <thead><tr><th>Ngày đo</th><th>Chiều cao</th><th>Cân nặng</th><th>BMI</th><th>Phân loại</th></tr></thead>
        <tbody id="bmiHistoryBody"></tbody>
      </table>
      <p id="bmiHistoryEmpty" class="text-muted small">Chưa có lịch sử đo nào. <a href="bmi.html">Đo BMI ngay</a>.</p>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/chatbot.js"></script>
<script src="assets/js/bmi.js"></script>
<script>
  requireLoginOrRedirect();
  renderHeader("");
  renderFooter();
  document.getElementById("profileName").textContent = localStorage.getItem("sths_user_name") || "Người dùng";
  renderBmiHistory();
</script>
</body>
</html>

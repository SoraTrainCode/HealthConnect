<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đăng ký, Sổ Tay Sức Khỏe</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<main class="container py-5">
  <div class="auth-panel">
    <h1 class="h3 font-display mb-1 text-center">Tạo tài khoản</h1>
    <p class="text-muted text-center mb-4 small">Miễn phí, chỉ mất một phút để bắt đầu theo dõi sức khỏe của bạn.</p>

    <div id="registerError" class="alert alert-danger py-2 small" style="display:none"></div>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label">Họ và tên</label>
        <input type="text" id="regFullName" class="form-control" placeholder="Nguyễn Văn A" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="regEmail" class="form-control" placeholder="ban@vidu.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Mật khẩu</label>
        <input type="password" id="regPassword" class="form-control" placeholder="Tối thiểu 8 ký tự" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Nhập lại mật khẩu</label>
        <input type="password" id="regConfirm" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-brand w-100 mb-3">Đăng ký</button>
      <p class="text-center small text-muted mb-0">
        Đã có tài khoản? <a href="dang-nhap.html">Đăng nhập</a>
      </p>
    </form>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/chatbot.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  renderHeader("");
  renderFooter();
  initRegisterForm();
</script>
</body>
</html>

# Mẫu tham khảo: chỉnh root, server_name, TLS và PHP socket theo hosting thực tế.
# Giả định website-yte-suckhoe là document root, không nằm dưới URL thư mục con.
server {
    listen 80;
    server_name healthconnect.example;
    root /var/www/healthconnect/website-yte-suckhoe;
    index index.php;
    autoindex off;
    location ~ (^|/)\. { deny all; }
    location ~* ^/(includes|database|docs|tools)(/|$) { deny all; }
    location ~* ^/config\..*\.php$ { deny all; }
    location = /HUONG_DAN.md { deny all; }
    location ~* ^/uploads/.*\.(php[0-9]*|phtml|phar)$ { deny all; }
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
# Cấu hình HTTPS hợp lệ trước khi dùng public/PWA. Không dùng nguyên mẫu HTTP này làm bản public cuối.
